name: Publish StudyCircle to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        type: choice
        default: live
        options:
          - live
          - classroom-demo
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ inputs.mode == 'live' && vars.VITE_SUPABASE_URL || '' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.mode == 'live' && vars.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ inputs.mode == 'live' && vars.VITE_WEB_PUSH_PUBLIC_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - name: Check live backend configuration
        if: inputs.mode == 'live'
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
