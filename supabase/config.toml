project_id = "studycircle"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = true
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "8MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173/"
additional_redirect_urls = ["http://127.0.0.1:5173/", "http://127.0.0.1:4173/"]
enable_signup = true
minimum_password_length = 10
[auth.email]
enabled = true
enable_confirmations = true
[edge_runtime]
enabled = true
[functions.question-file]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.dispatch-push]
verify_jwt = false
